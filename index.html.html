<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Krea AI Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 2rem;
        text-align: center;
      }
      canvas {
        max-width: 700px;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <h1>Krea AI Token Usage</h1>
    <canvas id="usageChart"></canvas>

    <script>
      const ctx = document.getElementById("usageChart").getContext("2d");
      const usageChart = new Chart(ctx, {
        type: "bar",
        data: {
          labels: ["Jan", "Feb", "Mar", "Apr", "May"],
          datasets: [
            {
              label: "Token Usage (in thousands)",
              data: [12, 19, 3, 5, 8],
              backgroundColor: "#6c63ff",
            },
          ],
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true,
            },
          },
        },
      });
    </script>
  </body>
</html>
